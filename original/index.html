<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Jarvis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--c:#5ecbff;--dim:rgba(94,203,255,.35);--bgp:rgba(6,22,38,.6)}
html,body{margin:0;height:100%;overflow:hidden;background:#01030a;color:var(--c);font-family:Rajdhani,ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%}
#c{touch-action:none}
.cut{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
#top{position:fixed;top:10px;left:50%;transform:translateX(-50%);width:min(70vw,420px);text-align:center}
#title{text-transform:uppercase;font-family:Orbitron,sans-serif;font-weight:700;font-size:18px;letter-spacing:.45em;padding-left:.45em;color:#fff;text-shadow:0 0 12px var(--c)}
#shield{height:9px;margin:6px 0 3px;border:1px solid var(--dim);background:rgba(94,203,255,.08);transform:skewX(-25deg)}
#fill{height:100%;width:100%;background:repeating-linear-gradient(90deg,#8fe4ff 0 10px,#2a8fd0 10px 12px);box-shadow:0 0 10px var(--c);transition:width 1s}
#fill.low{background:repeating-linear-gradient(90deg,#ff6060 0 10px,#a02020 10px 12px);animation:blink .6s infinite}
@keyframes blink{50%{opacity:.35}}
#cap{font-size:11px;font-weight:600;letter-spacing:.3em}
#lvl{margin-top:4px;font-size:11px;font-weight:700;letter-spacing:.3em;color:#ffd36b}
#xp{height:3px;margin:3px auto 0;width:60%;background:rgba(255,211,107,.15)}
#xpf{height:100%;width:0;background:#ffd36b;box-shadow:0 0 8px #ffd36b;transition:width 1s}
#lvl.up{animation:blink .4s 6}
.panel{position:fixed;top:76px;padding:6px 10px;font-size:12px;font-weight:600;letter-spacing:.14em;line-height:1.5;text-transform:uppercase;background:var(--bgp);border-left:2px solid var(--c)}
#tl{left:10px}#tr{right:10px;text-align:right;border-left:0;border-right:2px solid var(--c)}
#clock{font-family:Orbitron,sans-serif;font-size:15px;color:#fff}
#sys{margin-top:4px;color:#fff}
#feat{margin-top:6px;font-size:11px;letter-spacing:.1em}
#feat div{white-space:nowrap}#feat .on{color:#5effc8}#feat .off{color:#4b6478}#feat span{opacity:.7}
#timers{margin-top:6px;color:#ffc34f}
#rem{margin-top:6px;color:#ff9f6b;max-width:240px}
#rem div,#todo div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#todo{margin-top:8px;max-width:240px;text-transform:none;letter-spacing:.04em;font-size:14px;color:#dff4ff}
#todo div{cursor:pointer}#todo .done{opacity:.4;text-decoration:line-through}
#todo b{display:block;font-size:11px;letter-spacing:.2em;color:var(--c);text-transform:uppercase}
#notes{margin-top:8px;max-width:240px;text-transform:none;letter-spacing:.04em;font-size:13px;color:#ffe2a8}
#notes div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#notes b{display:block;font-size:11px;letter-spacing:.2em;color:#ffc34f;text-transform:uppercase}
#eye{display:none;margin:8px 0 0 auto;width:160px;border:1px solid var(--dim)}
#ui{position:fixed;left:10px;right:10px;bottom:10px}
#out{max-height:24vh;overflow:auto;white-space:pre-wrap;font-size:15px;font-weight:500;line-height:1.35;margin-bottom:8px;padding:8px 14px;background:var(--bgp);border:1px solid var(--dim)}
#out:empty{display:none}
#out .you{color:#9fb3c8}#out .tool{color:#7d9bb3;font-size:13px}
#appr{display:grid;gap:6px;margin-bottom:8px}
.card{padding:10px 14px;background:rgba(40,26,6,.9);border:1px solid #ffc34f;color:#ffe2a8;display:grid;gap:6px;font-size:15px}
.card b{font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.2em;color:#ffc34f}
.card code{font:14px ui-monospace,monospace;color:#fff;white-space:pre-wrap;word-break:break-all}
.card div{display:flex;gap:8px}.card button{padding:8px 18px}
.card .run{background:#ffc34f;color:#000;border-color:#ffc34f}
form{display:flex;gap:6px;margin:0}
input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:600;padding:10px 14px;background:rgba(2,14,26,.85);border:1px solid var(--c);color:#fff;outline:none;border-radius:0}
button{font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.12em;padding:0 12px;background:rgba(94,203,255,.15);border:1px solid var(--c);color:var(--c);border-radius:0;cursor:pointer}
button.on{background:#ff4fd8;color:#000;border-color:#ff4fd8}
#stop{border-color:#ff6060;color:#ff8080;background:rgba(255,80,80,.12)}
#set,#logv,#hv{position:fixed;inset:0;display:none;place-items:center;background:rgba(1,3,10,.78);z-index:5}
#set.open,#logv.open,#hv.open{display:grid}
#trust{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:4;display:none;padding:6px 14px;background:rgba(80,0,0,.92);
  border:1px solid #ff5050;color:#ffb0b0;font:700 11px Orbitron,sans-serif;letter-spacing:.14em;cursor:pointer;
  box-shadow:0 0 18px rgba(255,60,60,.5);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#trust.on{display:block}
#lbox{width:min(760px,94vw);max-height:88vh;overflow:auto;padding:16px 20px;background:#061626;border:1px solid var(--c)}
#lbox h3,#hbox h3{font:700 12px Orbitron,sans-serif;letter-spacing:.2em;margin:0 0 8px;color:#fff}
#lbox .row,#hbox .row{display:flex;gap:8px;margin-top:12px}#lbox .row button,#hbox .row button{padding:10px 18px}
#hbox{width:min(760px,94vw);max-height:88vh;overflow:auto;padding:16px 20px;background:#061626;border:1px solid var(--c)}
#hbig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 6px}#hbig button{padding:12px 4px;font-size:12px}
#hlist h4{font:700 11px Orbitron,sans-serif;letter-spacing:.2em;color:#9fd8ff;margin:14px 0 6px}
#hlist .chips{display:flex;flex-wrap:wrap;gap:6px}#hlist .chips button{padding:8px 11px;font:600 14px Rajdhani,sans-serif;letter-spacing:.04em;text-transform:none;color:#dff4ff}
#hlist .chips button.fill{border-style:dashed}#hlist p{margin:4px 0;font-size:14px;color:#bcd3e4;letter-spacing:.03em}
#lrows div{padding:6px 0;border-bottom:1px solid rgba(94,203,255,.15);font-size:14px;letter-spacing:.03em;word-break:break-word}
#lrows b{color:#9fd8ff;margin-right:6px}#lrows i{font-style:normal;color:#7f9db5;margin-right:6px}
#lrows .auto b{color:#ff8080}#lrows .auto i:after{content:' · RAN BY ITSELF';color:#ff8080}
#lrows span{display:block;color:#bcd3e4;font-size:13px}
#strust.on{background:#ff5050;color:#000;border-color:#ff5050}
#sbox{width:min(560px,94vw);max-height:88vh;overflow:auto;padding:16px 20px;background:#061626;border:1px solid var(--c)}
#sbox h3{font:700 12px Orbitron,sans-serif;letter-spacing:.2em;margin:18px 0 4px;color:#fff}
#sbox h3:first-child{margin-top:0}
#sbox label{display:grid;gap:3px;margin:8px 0;font-size:14px;letter-spacing:.04em}
#sbox input,#sbox select,#sbox textarea{font:inherit;font-size:15px;padding:7px 10px;background:#01030a;border:1px solid var(--dim);color:#fff;border-radius:0;outline:none}
#sbox textarea{height:150px;font:12px ui-monospace,monospace}
#sbox .chk{display:flex;gap:8px;align-items:center}#sbox .chk input{flex:0 0 auto;width:20px;height:20px;padding:0;accent-color:#5ecbff}
#sbox .hint{font-size:13px;color:#8eb0c6;margin:2px 0}
#sbox .row{display:flex;gap:8px;margin-top:12px}#sbox .row button{padding:10px 18px}
#smsg{min-height:1.3em;margin:10px 0 0;color:#5effc8}#smsg.bad{color:#ff8080}
@media (max-width:640px){#feat,#stats,#sys,#eye{display:none}.panel{font-size:11px}#tr{max-width:46vw}
  form{gap:4px}form button{padding:0 7px;font-size:10px;letter-spacing:.04em}input{min-width:96px}#hbig{grid-template-columns:repeat(2,1fr)}}
/* phone layout: one column, big touch targets, the brain in the middle */
#line{margin-top:4px;font-size:11px;font-weight:600;letter-spacing:.18em;color:#9fd8ff;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
form button{min-height:46px;padding:0 10px}
#pc{border-color:#c77dff;color:#d9a8ff;background:rgba(199,125,255,.12)}
#sbox .row{flex-wrap:wrap}
@media (max-width:640px){
  #top{width:calc(100vw - 24px)}
  #tl{top:auto;bottom:calc(24vh + 76px);display:none}
  #tr{top:104px;max-width:52vw}
  #out{max-height:30vh;font-size:16px}
  form{flex-wrap:nowrap;gap:4px}
  form button{padding:0 8px;font-size:11px;letter-spacing:.06em}
  input{font-size:16px;padding:10px}
}
/* small screens, like a flip phone's outer screen: just the brain, the chat and the buttons */
@media (max-height:520px){
  #tr,#line,#xp,#cap{display:none}
  #shield{margin:4px 0 0}
  #lvl{font-size:10px}
  #out{max-height:22vh;font-size:15px}
}
</style></head><body>
<canvas id="bg"></canvas><canvas id="c"></canvas>
<div id="top"><div id="title">JARVIS</div><div id="shield"><div id="fill"></div></div><div id="cap">SHIELD 100%</div>

<div id="set"><div id="sbox" class="cut"><div id="sform"></div><p id="smsg"></p><div class="row"><button type="button" id="ssave">SAVE</button><button type="button" id="ssync">SYNC MEMORIES</button><button type="button" id="sclose">CLOSE</button></div></div></div>
<div id="logv"><div id="lbox" class="cut"><h3>ACTIVITY · EVERYTHING JARVIS DID ON THE PHONE</h3><div id="lrows"></div><div class="row"><button type="button" id="lclose">CLOSE</button></div></div></div>
<div id="hv"><div id="hbox" class="cut"><h3>WHAT JARVIS CAN DO</h3><div id="hbig"></div><div id="hlist"></div><div class="row"><button type="button" id="hclose">CLOSE</button></div></div></div>

</script><script>

const NAME = "Jarvis", REMOTE = false;   // REMOTE: this page is open on the phone over the phone link
// older phones' web engines (before Chrome 86) don't have replaceChildren
if (!Element.prototype.replaceChildren) Element.prototype.replaceChildren = function (...kids) { this.textContent = ''; this.append(...kids); };
const $ = id => document.getElementById(id);
const c = $('c'), x = c.getContext('2d'), bg = $('bg'), bx = bg.getContext('2d'), d = Math.min(devicePixelRatio || 1, 2);
let W, H;
function size() { W = c.width = bg.width = innerWidth * d; H = c.height = bg.height = innerHeight * d; space(); }

// ---- space: drifting nebula, twinkling and shooting stars, a passing moon, and the holographic world Jarvis hovers over ----
// space() builds the pieces for this screen size, drawSpace() moves them (20-30 times a second, fewer in battery saver).
// It all follows Jarvis: stars rush past and data races into the projector while he thinks, ripples spread out over
// the world while he speaks and flow in while he listens, and everything takes on his mood colour.
let sky = null, skyAt = 0;
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;   // the system asks for less motion: barely moves
const TILT = 0.17, cT = Math.cos(TILT), sT = Math.sin(TILT), G = [0, 0, 0];
function glowBlob(rgb, inner) {
  const s = document.createElement('canvas'); s.width = s.height = 256;
  const g = s.getContext('2d'), r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  r.addColorStop(0, 'rgba(' + rgb + ',' + inner + ')'); r.addColorStop(0.5, 'rgba(' + rgb + ',' + inner * 0.4 + ')'); r.addColorStop(1, 'rgba(' + rgb + ',0)');
  g.fillStyle = r; g.fillRect(0, 0, 256, 256); return s;
}
function space() {
  let s = 3; const r = () => (s = s * 16807 % 2147483647) / 2147483647;
  const pr = W * 1.15, px = W * 0.5, py = H * 0.68 + pr;
  const body = bx.createRadialGradient(px, py - pr * 0.98, pr * 0.02, px, py, pr);
  body.addColorStop(0, '#1d2a55'); body.addColorStop(0.35, '#0b1230'); body.addColorStop(1, '#02030a');
  sky = {pr, px, py, body, warp: 0, glow: 0, flash: 0, spin: 0, shot: null, nextShot: 2, nextPulse: 1, nextRipple: 0,
    pulses: [], ripples: [], moonGlow: glowBlob('200,215,255', 0.5), core: glowBlob('255,255,255', 0.9),
    nebula: [[0.15, 0.25, 1.2, '70,30,130'], [0.9, 0.45, 1.0, '20,60,140'], [0.5, 0.38, 0.8, '20,100,150'],
             [0.74, 0.1, 0.6, '150,40,120'], [0.3, 0.6, 0.7, '30,140,160']].map(([fx, fy, fr, rgb], i) => ({fx, fy, fr, img: glowBlob(rgb, 0.36), ph: i * 1.9})),
    stars: Array.from({length: 360}, () => ({x: r(), y: r() * 0.75, z: (r() < 0.06 ? 1.8 : 0.9) * d, a: 0.2 + r() * 0.8,
      tw: r() * 6.283, sp: 0.4 + r() * 2.2, blue: r() < 0.2, depth: 0.3 + r() * 0.7})),
    nodes: Array.from({length: 110}, () => ({th: 0.1 + r() * 1.1, la: r() * 6.283, tw: r() * 6.283, sp: 1 + r() * 3})),
    motes: Array.from({length: 22}, () => ({ph: r(), off: r() * 2 - 1, sp: 0.1 + r() * 0.12}))};
  skyAt = 0;
}
function globe(th, la) {     // a point on the world (th from its pole, la around it) -> G = [screen x, y, facing us]
  const st = Math.sin(th), y = Math.cos(th), xx = st * Math.sin(la), z = st * Math.cos(la);
  G[0] = sky.px + sky.pr * xx; G[1] = sky.py - sky.pr * (y * cT - z * sT); G[2] = y * sT + z * cT; return G;
}
function trace(n, at) {      // one line over the world's front side, n steps, at(j) sets G
  bx.beginPath(); let down = false;
  for (let j = 0; j <= n; j++) {
    at(j);
    if (G[2] > 0.01 && G[1] < H + 20) { down ? bx.lineTo(G[0], G[1]) : bx.moveTo(G[0], G[1]); down = true; } else down = false;
  }

}

  k.warp += ((state === 'thinking' ? 1 : 0) - k.warp) * Math.min(1, dt * 1.5);        // eases in and out
  k.glow += ((state === 'speaking' ? amp : 0) - k.glow) * Math.min(1, dt * 6);
  k.flash *= Math.max(0, 1 - dt * 3);
  k.spin += dt * (0.025 + k.warp * 0.2);
  bx.globalAlpha = 1; bx.fillStyle = '#01030a'; bx.fillRect(0, 0, W, H);
  bx.globalCompositeOperation = 'lighter';                                          // nebula: clouds drift and breathe
  for (const n of k.nebula) {
    const sz = M * n.fr * (1 + 0.08 * Math.sin(t * 0.07 + n.ph));
    const cx = W * n.fx + Math.cos(t * 0.03 + n.ph) * M * 0.04, cy = H * n.fy + Math.sin(t * 0.025 + n.ph) * M * 0.03;
    bx.globalAlpha = Math.min(1, 0.75 + 0.25 * Math.sin(t * 0.11 + n.ph * 2) + k.warp * 0.3);
    bx.drawImage(n.img, cx - sz / 2, cy - sz / 2, sz, sz);
  }
  bx.globalCompositeOperation = 'source-over';
  const drift = 0.004 + k.warp * 0.15;                                              // stars: drift, twinkle, streak
  for (const s of k.stars) {

    bx.globalAlpha = s.a * (0.6 + 0.4 * Math.sin(t * s.sp + s.tw));
    bx.fillStyle = s.blue ? '#9fd8ff' : '#ffffff';
    const len = s.z + k.warp * 26 * d * s.depth;
    bx.fillRect(s.x * W - len, s.y * H, len, s.z);
  }
  k.nextShot -= dt;                                                                 // a shooting star now and then
  if (!k.shot && k.nextShot <= 0 && !CALM) k.shot = {x: W * (0.35 + Math.random() * 0.65), y: H * Math.random() * 0.3, age: 0, ang: 2.45 + Math.random() * 0.45};
  if (k.shot) {
    const sh = k.shot, p = (sh.age += dt) / 1.1, len = 190 * d, cs = Math.cos(sh.ang), sn = Math.sin(sh.ang);
    const hx = sh.x + cs * 950 * d * sh.age, hy = sh.y + sn * 950 * d * sh.age;
    const g = bx.createLinearGradient(hx, hy, hx - cs * len, hy - sn * len);

  bx.globalCompositeOperation = 'lighter'; bx.lineWidth = d;

    globe(n.th, n.la + k.spin);
    if (G[2] < 0.05) continue;
    const z = (5 + 6 * (0.5 + 0.5 * Math.sin(t * n.sp + n.tw))) * d * Math.min(1, G[2] * 3);

  }

    p.th -= dt * (0.3 + k.warp * 0.9);
    for (let j = 0; j < 4; j++) {

async function instant(text) {

  if (['open the browser', 'open your browser', 'open my browser', 'open jarvis browser', 'open the jarvis browser'].includes(t)) return browse('open', 'https://www.google.com/');
  if (['close the browser', 'close your browser', 'close browser'].includes(t)) return browse('close');
  if ((m = t.match(/^(?:play|put on) (.+?) on youtube$/))) return browse('play', m[1]);
  if ((m = t.match(/^(?:search youtube for|youtube|find (.+?) on youtube)(?: (.+))?$/)) && (m[1] || m[2])) return browse('youtube', m[1] || m[2]);
  if ((m = t.match(/^(?:google|search google for|look up (.+?) on google)(?: (.+))?$/)) && (m[1] || m[2])) return browse('search', m[1] || m[2]);
  if (LEARN_ASK.test(t) && !QUESTION.test(t)) return (await browse('learn')).replace(' (information only)', '');
  if (WATCH_ASK.test(t)) return (await browse('watch', s)).replace(' (information only)', '');
  if (['what have you learned', 'what have you learnt', 'what did you learn', 'show your notes', 'read your notes'].includes(t)) {
    const n = notes().slice(-5); return n.length ? 'Lately I learned: ' + n.join(' ') : "I haven't learned anything from the web yet.";
  }

  }
  if ((m = s.match(/^(?:please )?(?:can you )?add (.+?) to (?:my |the )?(?:to-?do |shopping )?list$/i))) return todo('add', m[1]);
  if (/^(?:what's|what is) on my (?:to-?do |shopping )?list$|^(?:show|read) (?:me )?my (?:to-?do |shopping )?list$/.test(t)) return todo('list');
  if ((m = s.match(/^(?:remember that (.+)|(.+?),? (?:please )?remember (?:that|this))$/i))) {
    const r = remember('The user said: ' + (m[1] || m[2]));
    return r.startsWith('Saved') ? "I'll remember that, " + you() + '.' : r;
  }
  if ((m = t.match(/^(?:set an alarm|wake me(?: up)?) (?:(today|tomorrow) )?(?:at|for) (\d{1,2}(?:[:.]\d{2})?(?: ?[ap]\.?m\.?)?)(?: (today|tomorrow))?$/))) return setAlarm(m[2], 'Wake up', m[1] || m[3]);
  if ((m = s.match(/^remind me (?:(today|tomorrow) )?at (\d{1,2}(?:[:.]\d{2})?(?: ?[ap]\.?m\.?)?)(?: (today|tomorrow))? to (.+)$/i))) return setAlarm(m[2], m[4], m[1] || m[3]);

      !(m[1] && /\b(this|tonight|tomorrow|morning|afternoon|evening|later|next|weekend)\b/.test(m[1])) && (m[1] || settings().city)) {

async function chat(text) {

  stopVoice();
  log('you', '> ' + text);
  cur = null;

  try { quick = await instant(text); } catch (e) { quick = 'Sorry ' + you() + ', that went wrong (' + e.message + ').'; }
  if (quick) {                // kept out of the brain's conversation: it must not learn to answer without its tools
    did('instant command', {text}, quick);
    reply(quick); addXp(3);
    return quick;
  }
  thinking(true);
  convo.push({role: 'user', content: text + '\n(' + stamp() + ')'});
  const messages = [systemPrompt()].concat(memoryMessages(), convo);
  let raw = '', mood = null, nudged = false;
  try {
    for (let round = 0; round <= 4; round++) {
      const msg = await complete(messages, round < 4 ? tools() : null);
      if (mine !== gen) return '';
      raw = msg.content || '';
      const calls = msg.tool_calls || [], tag = TAG.exec(raw);

      const claim = clean(raw).match(CLAIM), past = claim && round > 0 && /^(i've|i have|jag har)$/i.test(claim[1]);  // after a tool, "I've saved it" is true

        nudged = true;
        messages.push({role: 'assistant', content: raw}, {role: 'user', content: "System note (not from the user): you answered without using a tool. " +
          "If the user asked for something a tool can do or check (weather, battery, timers, alarms, lists, memory, notes), call that tool now and answer from its result; otherwise say your answer again."});
        continue;

        const name = c.function.name, args = typeof c.function.arguments === 'string' ? parse(c.function.arguments) || {} : c.function.arguments || {};
        messages.push({role: 'tool', tool_call_id: c.id, content: await runTool(name, args)});
        if (mine !== gen) return '';

    }
    const answer = clean(raw) || 'Done, ' + you() + '.';
    reply(answer);
    convo.push({role: 'assistant', content: raw.trim() || '[' + (mood || 'calm') + '] ' + answer});
    trim();
    feeling = mood || guess(text);
    addXp(10); refresh();
    return answer;
  } catch (e) {
    if (convo.length && convo[convo.length - 1].role === 'user') convo.pop();
    const msg = 'Sorry ' + you() + ", I can't reach a brain right now (" + e.message + ').';
    reply(msg); refresh();

  $('smsg').className = ''; $('smsg').textContent = 'Sharing memories with the laptop...';
  const r = await syncMemories();
  $('smsg').className = r.startsWith('Memories shared') ? '' : 'bad'; $('smsg').textContent = r;
};
addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });

// ---------- LOG: everything Jarvis did on the phone, newest first (the laptop's LOG shows the laptop's) ----------
const PHONE_APP = true;
const HIDE = /password|passcode|api[ _-]?key|token|secret|\bpin\b/i;
function did(tool, args, result) {
  const shown = JSON.stringify(args || {});
  keep('activity', load('activity', []).concat([{t: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19), tool,   // local time
    args: HIDE.test(shown) ? {hidden: 'it looked like a password'} : args || {}, result: HIDE.test(result) ? '[hidden]' : String(result).slice(0, 600)}]).slice(-200));
}
function openLog() { showLog(load('activity', []).slice().reverse()); }
$('lclose').onclick = () => $('logv').classList.remove('open');      // LOG opens from the ? panel
$('helpb').onclick = openHelp; $('hclose').onclick = () => $('hv').classList.remove('open');

// the pop-up over other apps: the app tells the phone whether it's wanted (ask = open Android's permission screen if needed)
function popup(ask) { return NB && NB.popup ? NB.popup(settings().popup !== 'off', ask) : 'no'; }
refresh();
if (VOICE && VOICE.useVoice) VOICE.useVoice(settings().voice || '');   // the voice picked in settings, or a male one
popup(false);
if (location.hash === '#laptop-unreachable') { window.history.replaceState(null, '', location.pathname); notice("I couldn't reach the laptop. Is Jarvis running there, and is the phone on the same Wi-Fi?"); }
const hour = new Date().getHours(), part = hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';
setTimeout(() => notice(settings().language === 'sv' ? (hour < 12 ? 'God morgon' : hour < 18 ? 'God eftermiddag' : 'God kväll') + ', ' + you() + '. Alla system är igång.'
                                                     : 'Good ' + part + ', ' + you() + '. All systems online.', true), 600);
</script></body></html>
